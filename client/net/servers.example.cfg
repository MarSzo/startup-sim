; The servers the client offers on the login screen (by name only; the
; address stays hidden). Copy to servers.cfg (not in the repository) and put
; your server here - official builds ship it; without it the client only
; knows the local server (127.0.0.1:7777).
;
; Optionally pin the server's login certificate: deploy/pull-cert.sh saves it
; to net/pins/<host>_<port>.pem (also not in the repository).

[test]
name="Serwer testowy"
address="example.com:7777"
