[package]
name = "startup-server"
version = "0.1.0"
edition = "2021"
default-run = "server"

[lib]
name = "game"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "bots"
path = "src/bin/bots.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
fastrand = "2"
socket2 = "0.6"

[profile.dev]
opt-level = 1
